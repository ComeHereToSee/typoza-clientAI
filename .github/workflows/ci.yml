name: ci

on:
  push:
    branches: [dev, main]
    # 只改文档不跑:私有仓库的 Actions 分钟数有限(macOS 按 10 倍计)。
    # 空提交没有改动文件,同样会被这条过滤掉;要重跑用 Actions 页面的 Run workflow
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write # ci/publish.sh 把日志与产物推到 ci/<job> 分支

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_OUT: ${{ github.workspace }}/ci-out

jobs:
  editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: npm ci
        run: ../ci/step.sh npm-ci npm ci
      - name: build
        id: build
        run: ../ci/step.sh build npm run build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: editor-dist
          path: editor/dist
          retention-days: 3
      - name: typecheck
        if: ${{ !cancelled() }}
        run: ../ci/step.sh typecheck npm run typecheck
      - name: unit
        if: ${{ !cancelled() }}
        run: ../ci/step.sh unit npx vitest run --reporter=verbose
      - name: playwright install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ../ci/step.sh playwright-install npx playwright install --with-deps webkit
      - name: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ../ci/step.sh e2e npx playwright test
      - name: app icon
        id: icon
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ../ci/step.sh icon node scripts/render-icon.mjs dist-icon/AppIcon.iconset
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.icon.outcome == 'success' }}
        with:
          name: app-icon
          path: editor/dist-icon
          retention-days: 3
      - name: publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$CI_OUT"
          if [ -d test-results ]; then cp -R test-results "$CI_OUT/test-results"; fi
          if [ -d dist ]; then du -ah dist | sort -h | tail -40 > "$CI_OUT/dist-sizes.txt"; fi
          if [ -d dist-icon ]; then cp -R dist-icon "$CI_OUT/icon"; fi
          ../ci/publish.sh editor "${{ job.status }}"

  helper:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: deps
        # 模块代理偶发流中断(INTERNAL_ERROR),下载单独成步并重试,别让网络抖动冒充代码问题
        run: ../ci/step.sh deps bash -c 'for i in 1 2 3; do go mod download && exit 0; sleep $((i * 5)); done; exit 1'
      - name: vet
        run: ../ci/step.sh vet go vet ./...
      - name: test
        if: ${{ !cancelled() }}
        run: ../ci/step.sh test go test -race -count=1 ./...
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: ../ci/step.sh govulncheck go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
      - name: gosec
        if: ${{ !cancelled() }}
        env:
          GOTOOLCHAIN: go1.26.9 # gosec v2.29.0 依赖的 x/tools v0.49.0 读不了 Go 1.27 导出数据(与后端一致)
        run: ../ci/step.sh gosec go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude-generated -severity medium ./...
      - name: cross build
        id: cross
        if: ${{ !cancelled() }}
        run: |
          ../ci/step.sh build-arm64 env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/typoza-helper-darwin-arm64 ./cmd/typoza-helper
          ../ci/step.sh build-amd64 env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/typoza-helper-darwin-amd64 ./cmd/typoza-helper
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.cross.outcome == 'success' }}
        with:
          name: helper-darwin
          path: helper/dist
          retention-days: 3
      - name: publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../ci/publish.sh helper "${{ job.status }}"

  macos:
    needs: [editor, helper]
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: editor-dist
          path: editor/dist
      - uses: actions/download-artifact@v4
        with:
          name: helper-darwin
          path: helper/dist
      - uses: actions/download-artifact@v4
        with:
          name: app-icon
          path: app-icon
      - name: toolchain
        run: ci/step.sh toolchain bash -c "sw_vers; xcodebuild -version; swift --version"
      - name: swift test
        run: ci/step.sh swift-test bash -c "cd app && swift test"
      - name: package
        id: package
        if: ${{ !cancelled() }}
        run: ci/step.sh package scripts/build-app.sh "$RUNNER_TEMP/build"
      - name: smoke
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: ci/step.sh smoke ci/smoke-macos.sh "$RUNNER_TEMP/build/Typoza.app" "$CI_OUT/smoke"
      - name: dmg
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          mkdir -p "$CI_OUT/artifacts"
          ci/step.sh dmg scripts/make-dmg.sh "$RUNNER_TEMP/build/Typoza.app" "$CI_OUT/artifacts/Typoza.dmg"
      - name: publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci/publish.sh macos "${{ job.status }}"
